name: Build & deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run lint
      - name: Describe road signs (Wikimedia metadata)
        if: github.ref != 'refs/heads/main'
        run: node scripts/describe-signs.mjs
      - name: Cache road signs
        uses: actions/cache@v4
        with:
          path: public/signs
          key: signs-${{ hashFiles('src/data/signs.json') }}
          restore-keys: signs-
      - name: Download road signs from Wikimedia Commons
        run: node scripts/fetch-signs.mjs --strict
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
